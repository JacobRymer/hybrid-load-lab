[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hll"
version = "0.1.0"
description = "Comparing watch-based (metabolic) training load with a mechanical load proxy and subjective data for hybrid and HYROX athletes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.18",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyarrow>=14",
    "kaleido",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "ipykernel",
    "nbstripout",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks are personal analysis drafts: not formatted or linted (CI included).
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
